# Nested Hyprland for AuraShell development.
#
# Seeded into ~/.config/hypr/hyprland.conf by hypr-nested on first run; edit it
# there, not here. Deliberately has no exec-once: a nested session that starts
# its own bar would fight the one you are debugging.

# The size of the window the host compositor gives this session.
monitor = ,1600x900@60,0x0,1

general {
    border_size = 2
    gaps_in = 4
    gaps_out = 8
}

decoration {
    rounding = 6
}

# Off by default: a bar redrawing behind a workspace animation is one variable
# too many when the thing under test is the bar. Turn it on to check for real.
animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

input {
    kb_layout = us
    follow_mouse = 1
}

env = XCURSOR_SIZE,24

# ALT, not SUPER: the host session almost certainly owns SUPER, and a bind that
# never reaches the nested compositor looks like a Hyprland bug for an hour.
$mod = ALT

bind = $mod, Return, exec, foot
bind = $mod, Q, killactive
bind = $mod SHIFT, E, exit
bind = $mod, F, fullscreen

# Enough workspaces to watch a bar's workspace strip react to real events.
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
